<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BADDIES Club — Soft Life, Strong Will</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600;1,700&display=swap" rel="stylesheet">

<style>

:root{
  --cream:#f7eee9;
  --paper:#fffaf7;
  --pink:#e77d99;
  --pink-soft:#f2c4ce;
  --plum:#382330;
  --brown:#624c55;
  --line:rgba(56,35,48,.18);
  --yellow:#f5e0a7;
  --green:#dce8d8;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  background:var(--cream);
  color:var(--plum);
  font-family:"DM Sans",sans-serif;
  overflow-x:hidden;
}

img{
  display:block;
  width:100%;
}

button,
a{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}


/* =========================
   TOP BAR
========================= */

.topbar{
  height:38px;
  padding:0 5vw;
  display:flex;
  justify-content:space-between;
  align-items:center;
  border-bottom:1px solid var(--line);
  font-size:11px;
  letter-spacing:.16em;
  text-transform:uppercase;
}

.topbar span:last-child{
  letter-spacing:.1em;
}


/* =========================
   NAV
========================= */

nav{
  height:92px;
  padding:0 5vw;
  display:flex;
  align-items:center;
  justify-content:space-between;
  border-bottom:1px solid var(--line);
  background:rgba(247,238,233,.94);
  backdrop-filter:blur(14px);
  position:sticky;
  top:0;
  z-index:100;
}

.logo{
  font-family:"Playfair Display",serif;
  font-size:32px;
  font-weight:700;
  letter-spacing:-.04em;
}

.logo em{
  color:var(--pink);
  font-weight:500;
}

.nav-links{
  display:flex;
  gap:34px;
  align-items:center;
  font-size:14px;
  font-weight:600;
}

.nav-links a{
  position:relative;
}

.nav-links a::after{
  content:"";
  position:absolute;
  left:0;
  bottom:-7px;
  width:0;
  height:1px;
  background:var(--pink);
  transition:.3s;
}

.nav-links a:hover::after{
  width:100%;
}

.join-btn{
  border:0;
  background:var(--plum);
  color:white;
  padding:15px 27px;
  border-radius:50px;
  font-weight:700;
  transition:.3s;
}

.join-btn:hover{
  background:var(--pink);
  transform:translateY(-2px);
}


/* =========================
   HERO
========================= */

.hero{
  min-height:760px;
  padding:90px 5vw 100px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:70px;
  align-items:center;
  position:relative;
  overflow:hidden;
}

.hero::before{
  content:"";
  position:absolute;
  width:520px;
  height:520px;
  border-radius:50%;
  background:#e7dcef;
  left:-230px;
  top:50px;
  opacity:.7;
  z-index:-1;
}

.hero-copy{
  max-width:650px;
}

.eyebrow{
  color:var(--pink);
  font-size:12px;
  font-weight:700;
  letter-spacing:.24em;
  text-transform:uppercase;
  margin-bottom:25px;
}

.hero h1{
  font-family:"Playfair Display",serif;
  font-size:clamp(65px,8vw,118px);
  line-height:.84;
  letter-spacing:-.065em;
  font-weight:600;
}

.hero h1 .pink{
  color:var(--pink);
  font-style:italic;
}

.hero-description{
  margin-top:34px;
  max-width:570px;
  font-size:17px;
  line-height:1.7;
  color:var(--brown);
}

.hero-buttons{
  display:flex;
  gap:14px;
  margin-top:38px;
}

.primary{
  background:var(--plum);
  color:white;
  border:0;
  padding:17px 30px;
  border-radius:50px;
  font-weight:700;
  transition:.3s;
}

.primary:hover{
  background:var(--pink);
  transform:translateY(-3px);
}

.secondary{
  background:transparent;
  color:var(--plum);
  border:1px solid var(--plum);
  padding:16px 28px;
  border-radius:50px;
  font-weight:600;
  transition:.3s;
}

.secondary:hover{
  background:var(--plum);
  color:white;
}


/* HERO COLLAGE */

.hero-collage{
  height:590px;
  position:relative;
}

.hero-photo{
  position:absolute;
  overflow:hidden;
  box-shadow:0 20px 50px rgba(56,35,48,.16);
}

.hero-photo img{
  height:100%;
  object-fit:cover;
  filter:saturate(.9) contrast(.98);
}

.hero-photo.one{
  width:270px;
  height:360px;
  right:80px;
  top:0;
  transform:rotate(3deg);
}

.hero-photo.two{
  width:330px;
  height:400px;
  left:20px;
  bottom:0;
  transform:rotate(-4deg);
}

.hero-photo.three{
  width:175px;
  height:230px;
  right:0;
  bottom:65px;
  transform:rotate(6deg);
}

.tape{
  position:absolute;
  height:26px;
  width:120px;
  background:rgba(255,220,213,.7);
  z-index:5;
}

.tape.one{
  top:12px;
  right:150px;
  transform:rotate(-4deg);
}

.tape.two{
  bottom:160px;
  left:170px;
  transform:rotate(5deg);
}

.note{
  position:absolute;
  right:0;
  top:255px;
  width:185px;
  padding:22px;
  background:var(--yellow);
  transform:rotate(4deg);
  box-shadow:0 12px 30px rgba(56,35,48,.1);
  font-family:"Playfair Display",serif;
  font-size:20px;
  line-height:1.25;
  z-index:10;
}


/* =========================
   MARQUEE
========================= */

.marquee{
  overflow:hidden;
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
  padding:16px 0;
  background:var(--paper);
}

.marquee-track{
  display:flex;
  width:max-content;
  animation:marquee 28s linear infinite;
}

.marquee-item{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.18em;
  font-weight:700;
  padding:0 28px;
  white-space:nowrap;
}

.marquee-item::after{
  content:"✦";
  margin-left:28px;
  color:var(--pink);
}

@keyframes marquee{
  from{transform:translateX(0)}
  to{transform:translateX(-50%)}
}


/* =========================
   SECTION
========================= */

section{
  padding:110px 5vw;
}

.section-label{
  color:var(--pink);
  font-size:11px;
  font-weight:700;
  letter-spacing:.22em;
  text-transform:uppercase;
  margin-bottom:15px;
}

.section-title{
  font-family:"Playfair Display",serif;
  font-size:clamp(42px,5vw,70px);
  line-height:1;
  letter-spacing:-.045em;
  font-weight:600;
}

.section-intro{
  max-width:620px;
  margin-top:20px;
  color:var(--brown);
  line-height:1.7;
}


/* =========================
   CLUB
========================= */

.club{
  background:var(--paper);
}

.club-header{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  margin-bottom:60px;
  gap:30px;
}

.club-header .section-intro{
  max-width:430px;
}

.pillars{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);
}

.pillar{
  padding:45px 35px;
  min-height:310px;
  border-right:1px solid var(--line);
}

.pillar:last-child{
  border-right:0;
}

.pillar-number{
  font-size:12px;
  letter-spacing:.15em;
  color:var(--pink);
  margin-bottom:60px;
}

.pillar-icon{
  font-size:28px;
  margin-bottom:18px;
}

.pillar h3{
  font-family:"Playfair Display",serif;
  font-size:32px;
  margin-bottom:14px;
}

.pillar p{
  color:var(--brown);
  line-height:1.65;
  font-size:14px;
}


/* =========================
   EDITORIAL FEED
========================= */

.feed{
  background:var(--cream);
}

.feed-header{
  text-align:center;
  max-width:700px;
  margin:0 auto 65px;
}

.editorial-grid{
  max-width:1200px;
  margin:auto;
  display:grid;
  grid-template-columns:1.1fr .9fr 1fr;
  grid-template-rows:300px 300px;
  gap:18px;
}

.editorial-card{
  position:relative;
  overflow:hidden;
  background:#ddd;
}

.editorial-card img{
  width:100%;
  height:100%;
  object-fit:cover;
  transition:transform .7s ease
